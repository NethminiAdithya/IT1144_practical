<!doctype html>
<html>
<head>
<title>Navigation</title>
<link rel="stylesheet" href=finalflexbox.css">
<style>
nav{background-color:black;padding:10px;}
ul{background-color:yellow; color:black;}
li{display:inline;margin:20px;padding:15px;}
a{color:black;}
a:hover{color:green;}


h2{color:blue;}
body{background-color:pink;}

*{box-sizing:border-box;}
.container{background-color:pink;padding:30px;border:2px solid red;display:flex;justify-content:space-between;}
.item{background-color:blue;padding:30px; border:2px solid blue; margin:5px;}




</style>
</head>
<body>


<center><h2>MY WEBSITE</h2></center>
<nav>


<ul>

<li><a href="#">HOME</a></li>
<li><a href="#">ABOUT</li></a>
<li><a href="#">CONTACT</li></a>
<li><a href="#">LOCATION</li></a>

</ul>
</nav>

<div class="container"></div>
<div class="item"><a href="#">HOME</div>
<div class="item"><a href="#">ABOUT</div>
</div>


</body>
</html>
